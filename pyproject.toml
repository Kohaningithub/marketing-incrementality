[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-incrementality"
version = "0.1.0"
description = "Auditable real-data marketing attribution and randomized experiment measurement"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "pyarrow>=18", "pandas>=2.2,<4", "numpy>=2", "scipy>=1.14", "statsmodels>=0.14", "matplotlib>=3.9", "requests>=2.32", "scikit-learn>=1.6,<2", "joblib>=1.4", "threadpoolctl>=3.5"]

[project.optional-dependencies]
cloud = ["google-cloud-bigquery>=3.25,<4", "sqlglot>=26"]
test = ["pytest>=8", "sqlglot>=26"]

[project.scripts]
measurement = "measurement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
