# Set GOOGLE_APPLICATION_CREDENTIALS_HOST to an existing ADC credential file.
# This overlay mounts credentials read-only and never copies them into the image.
services:
  airflow:
    environment:
      MEASUREMENT_BACKEND: bigquery
      GOOGLE_APPLICATION_CREDENTIALS: /opt/credentials/adc.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:?Set path to ADC file}:/opt/credentials/adc.json:ro
