name: Measurement tests
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sql/**'
      - 'tests/**'
      - 'dags/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[cloud,test]"
      - run: python -m pytest -q
      - run: python scripts/validate_artifacts.py
